<!DOCTYPE html>
<link rel="stylesheet" href="style.css">
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Apprendre Vue.js</title>
</head>

<body>

    <div id="app">
        <h2>Nos produits</h2>
            <ul>
                <li v-for="product in products">
                    {{ product }}
                </li>
            </ul>
    </div>

    <!-- Chargement de Vue.js 3 depuis le CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        const { createApp } = Vue
        
        createApp({
            data() {
                return {
                    products: [
                        'Steak',
                        'Saucisse',
                        'Brochette',
                        'Entrecote'
                    ]
                }
            },
            
            methods: {
                increaseQuantity() {
                    this.quantity++
                },

                decreaseQuantity() {
                    this.quantity--
                }
            },

            computed: {
                totalPrice() {
                    return this.price * this.quantity
                }
            }

        }).mount('#app')
    </script>

</body>
</html>
