<!DOCTYPE html>
<link rel="stylesheet" href="style.css">
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Apprendre Vue.js</title>
</head>

<body>

    <div id="app">
        <h1>{{ name }}</h1>
        <p> Country : {{ country }}</p>
        <p> Population : {{ population }}</p>
    </div>

    <!-- Chargement de Vue.js 3 depuis le CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        const { createApp } = Vue
        
        createApp({
            data() {
                return {
                    name: 'Madrid',
                    country: 'Spain',
                    population: 3480000
                }
            }
        }).mount('#app')
    </script>

</body>
</html>
