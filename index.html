<!DOCTYPE html>
<link rel="stylesheet" href="style.css">
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Apprendre Vue.js</title>
</head>

<body>

    <div id="app">
        <h1>{{ name }}</h1>
        <p> Price : {{ price }}</p>
        <p> Quantity : {{ quantity }}</p>
        
        <button @click="decreaseQuantity">-</button>
        <button @click="increaseQuantity">+</button>


    </div>

    <!-- Chargement de Vue.js 3 depuis le CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        const { createApp } = Vue
        
        createApp({
            data() {
                return {
                    name: 'Steak',
                    price: 22.5,
                    quantity: 5
                }
            },
            
            methods: {
                increaseQuantity() {
                    this.quantity++
                },

                decreaseQuantity() {
                    this.quantity--
                }
            }

        }).mount('#app')
    </script>

</body>
</html>
