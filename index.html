<!DOCTYPE html>
<link rel="stylesheet" href="style.css">
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Apprendre Vue.js</title>
</head>

<body>
    <div id="app">
        <p>{{ message }}</p>
        <button @click="increment(); sayHello()">Cliques si tu l'oses</button>
        <p>Nombre de clics : {{ clicks }}</p>
    </div>

    <!-- Chargement de Vue.js 3 depuis le CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        const { createApp } = Vue
        
        createApp({
            data() {
                return {
                    message: 'Salut toi !',
                    clicks: 0
                }
            },
            
            methods: {
                increment() {
                    this.clicks++
                },

                sayHello() {
                    alert("QUI T'A PERMIS DE CLIQUER SUR MON BOUTON !!!")
                }
            }

        }).mount('#app')
    </script>

</body>
</html>
