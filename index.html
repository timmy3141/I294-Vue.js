<!DOCTYPE html>
<link rel="stylesheet" href="style.css">
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Apprendre Vue.js</title>
</head>

<body>

    <div id="app">
        <h2>Nos produits</h2>
        <ul>
            <li v-for="product in products":key="product.id">
                {{ product.name }} -
                {{ product.price }} €
            </li>
        </ul>
    </div>

    <!-- Chargement de Vue.js 3 depuis le CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        const { createApp } = Vue
        
        createApp({
            data() {
                return {
                    products: [
                        { id: 1, name: 'Steak', price: 12 },
                        { id: 2, name: 'Saucisse', price: 80 },
                        { id: 3, name: 'Brochette', price: 25 },
                        { id: 4, name: 'Entrecote', price: 36 }
                    ]
                }
            },
            
            methods: {
                increaseQuantity() {
                    this.quantity++
                },

                decreaseQuantity() {
                    this.quantity--
                }
            },

            computed: {
                totalPrice() {
                    return this.price * this.quantity
                }
            }

        }).mount('#app')
    </script>

</body>
</html>
